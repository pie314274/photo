{% extends "layout.html" %}

{% block title %}
    Error | The Pixel
{% endblock %}

{% block main %}
<main class="auth-error-page">
    <section class="auth-error-card" role="alert" aria-labelledby="error-heading">
        <div class="auth-error-icon" aria-hidden="true">!</div>
        <p class="auth-error-eyebrow">Request error</p>
        <h1 id="error-heading">Something went wrong</h1>
        <p class="auth-error-message">{{ message }}</p>
        <div class="auth-error-actions">
            <a class="btn btn-primary auth-error-primary" href="{{ retry_url }}">{{ retry_label }}</a>
            <a class="auth-error-secondary" href="{{ url_for('index') }}">Back to home</a>
        </div>
    </section>
</main>
{% endblock %}
