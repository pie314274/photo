{% extends "layout.html" %}

{% block title %}
    Log in
{% endblock %}


{% block main %}
<main class="auth-page">
    <section class="auth-card">
        <form action="/back" method="post">
            <input type="hidden" name="destination" value="home">
            <button class="auth-brand" type="submit">The Pixel</button>
        </form>
        <p class="auth-eyebrow">Your edited photo is ready</p>
        <h1>Log in to save</h1>
        <p class="auth-description">Sign in to add this image to your gallery.</p>

        <form class="auth-form" action="/p_login" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" autocomplete="username" autofocus class="form-control"
                       name="username" placeholder="Your username" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" autocomplete="current-password" class="form-control"
                       name="password" placeholder="Your password" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in and save</button>
        </form>

        <p class="auth-switch">New to The Pixel? <a href="/p_signup">Create an account</a></p>
        <form class="auth-back-form" action="/back" method="post">
            <button class="btn btn-link" type="submit">Back to editing</button>
        </form>
    </section>
</main>
{% endblock %}
