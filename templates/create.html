{% extends "layout.html" %}

{% block title %}
    Create
{% endblock %}

{% block main %}
<main class="editor-page">
    <header class="editor-header">
        <div>
            <h1>Create your photo</h1>
            
        </div>
        <form action="/back" method="post">
            <input type="hidden" name="destination" value="home">
            <button class="btn btn-outline-secondary" type="submit">Back</button>
        </form>
    </header>

    <form id="editor-form" action="/pending" method="post" enctype="multipart/form-data"
          data-returning="{{ 'true' if output else 'false' }}"
          data-image-url="{{ output_url or '' }}"
          data-filename="{{ filename_by_user or '' }}">
    <section class="editor-workspace" aria-label="Photo editor">
        <div class="canvas-area">
            <div class="canvas-toolbar">
                <span class="file-name" id="file-name">No image selected</span>
                <span id="image-dimensions"></span>
            </div>
            <div class="canvas-stage" id="canvas-stage">
                <div class="upload-prompt" id="upload-prompt">
                    <div class="upload-icon" aria-hidden="true">＋</div>
                    <h2>Start with a photo</h2>
                    <p>Choose an image from your device or drag and drop it here.</p>
                    <button class="btn btn-primary choose-image" id="choose-image" type="button">Choose an image</button>
                    
                </div>
                <img class="editor-image" id="editor-image" alt="Image preview being edited">
            </div>
            <input id="image-input" name="image" type="file" accept="image/*" hidden>
            <input id="output-image" name="output_image" type="file" accept="image/jpeg" hidden>
        </div>

        <aside class="editor-sidebar" aria-label="Adjustments">
            <h2 class="sidebar-heading">Adjustments</h2>
            <div class="control-group">
                <label class="control-label" for="brightness">
                    Brightness <span class="control-value" id="brightness-value">100%</span>
                </label>
                <input id="brightness" name="brightness" data-filter="brightness" type="range" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label class="control-label" for="contrast">
                    Contrast <span class="control-value" id="contrast-value">100%</span>
                </label>
                <input id="contrast" name="contrast" data-filter="contrast" type="range" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label class="control-label" for="saturation">
                    Saturation <span class="control-value" id="saturation-value">100%</span>
                </label>
                <input id="saturation" name="saturation" data-filter="saturate" type="range" min="0" max="200" value="100">
            </div>

            <div class="control-group">
                <label class="control-label" for="image-filter">Preset filter</label>
                <select id="image-filter" name="filter" class="form-select">
                    <option value="normal">Normal</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="blur">Blur</option>
                    <option value="sharpen">Sharpen</option>
                    <option value="smooth">Smooth</option>
                    <option value="detail">Detail</option>
                    <option value="invert">Invert</option>
                    <option value="mirror">Mirror</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label" for="filename">Filename </label>
                <input id="filename" name="filename" class="form-control" type="text" maxlength="99" placeholder="Enter a filename to save" value="{{ filename_by_user or '' }}" required>
            </div>
            <div class="editor-actions">
                <button class="btn btn-outline-secondary secondary-action" id="reset-image" type="button" disabled>Reset adjustments</button>
                <button class="btn btn-primary" id="save-image" type="submit" disabled>Save image</button>
                <button class="btn btn-outline-primary download-image" id="download-image" type="button" disabled>Download edited image</button>
            </div>
            <p id="editor-status" role="status" aria-live="polite"></p>
        </aside>
    </section>

    </form>
</main>

<script src="{{ url_for('static', filename='script.js') }}" defer></script>
{% endblock %}
