{% extends "layout.html" %}

{% block title %}
    Sign up
{% endblock %}

{% block main %}
<main class="auth-page">
    <section class="auth-card">
        <form action="/back" method="post">
            <input type="hidden" name="destination" value="home">
            <button class="auth-brand" type="submit">The Pixel</button>
        </form>
        <p class="auth-eyebrow">Save your work</p>
        <h1>Create an account</h1>
        <p class="auth-description">Sign up to keep your edited photo in your gallery.</p>

        <form class="auth-form" action="/p_signup" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input id="username" autocomplete="username" autofocus class="form-control"
                       name="username" placeholder="Choose a username" type="text" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input id="password" autocomplete="new-password" class="form-control"
                       name="password" placeholder="Create a password" type="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmation">Confirm password</label>
                <input id="confirmation" autocomplete="new-password" class="form-control"
                       name="confirmation" placeholder="Enter your password again" type="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Create account and save</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="/p_login">Log in</a></p>
        <form class="auth-back-form" action="/back" method="post">
            <button class="btn btn-link" type="submit">Back to editing</button>
        </form>
    </section>
</main>
{% endblock %}
